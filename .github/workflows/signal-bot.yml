# Titan Signal v4.2.0 — Live Bot
# V4.2.0 OperationalWindows:
#   Signal issuance:  07:00–18:00 Tehran (03:30–14:30 UTC)
#   Management only:  18:00–02:00 Tehran (14:30–22:30 UTC)
#   Force close:      02:00 Tehran (22:30 UTC) — handled by nightly-monitor
name: Titan Signal Bot v4.2.0

on:
  schedule:
    # Signal issuance window: 07:00–18:00 Tehran = 03:30–14:30 UTC
    # Every 30 minutes during this window
    - cron: '30 3-14 * * *'
    - cron: '0 4-14 * * *'
    # Management-only window: 18:00–02:00 Tehran = 14:30–22:30 UTC
    # Every 30 minutes during this window (bot.py will skip signal issuance)
    - cron: '30 14-22 * * *'
    - cron: '0 15-22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    name: Live Bot v4.2.0
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure data directories
        run: mkdir -p data/signals

      - name: Show version
        run: |
          echo "Titan Signal version: 4.2.0"
          python -c "from titansignal.version import VERSION_LABEL; print(VERSION_LABEL)"

      - name: Run Signal Bot (manage + scan)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TITAN_DATABASE_URL: ${{ secrets.TITAN_DATABASE_URL }}
        run: python bot.py

      - name: Commit data to repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/signals
          git add -f data/ || true
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): v4.2.0 live bot update [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin HEAD || true
              git push && exit 0
              sleep 5
            done
            exit 1
          fi
